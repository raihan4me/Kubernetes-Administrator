apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: shop
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 'Shop frontend OK - pod $hostname\n';
      }
      location /api/ {
        proxy_pass http://backend.shop.svc.cluster.local:5678/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels:
    app: frontend
  annotations:
    kubernetes.io/change-cause: "initial release nginx:1.27-alpine"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: conf
        configMap:
          name: frontend-nginx
