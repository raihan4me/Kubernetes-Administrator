kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
- role: control-plane
  image: kindest/node:v1.30.4
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 9443
    protocol: TCP
- role: worker
  image: kindest/node:v1.30.4
- role: worker
  image: kindest/node:v1.30.4
